name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 만들기와 배포를 한 작업으로 합쳐 서버를 두 번 준비하지 않는다
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout notes
        uses: actions/checkout@v4
        with:
          path: notes

      - name: Checkout Quartz v4.5.2
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4.5.2
          path: quartz

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Quartz 설치 결과를 캐시해 두고, 캐시가 있으면 설치(npm ci)를 건너뛴다
      - name: Restore Quartz dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: quartz/node_modules
          key: quartz-v4.5.2-node22-${{ runner.os }}-${{ hashFiles('quartz/package-lock.json') }}

      - name: Install Quartz
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: quartz
        run: npm ci

      - name: Prepare content and config
        run: |
          rm -rf quartz/content
          mkdir -p quartz/content
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '.quartz' --exclude '.obsidian' \
            --exclude 'CLAUDE.md' --exclude '99 템플릿' --exclude '.gitignore' \
            notes/ quartz/content/
          # 사이트 첫 화면 = 0일차 일지 (제목을 붙여 index.md로 복사)
          { echo '---'; echo 'title: 0일차'; tail -n +2 "notes/01 일지/0일차.md"; } > quartz/content/index.md
          # 사이트 설정·부품: 볼트의 .quartz/는 Quartz 폴더 구조 그대로라 통째로 덮어쓴다
          cp -r notes/.quartz/. quartz/

      - name: Build
        working-directory: quartz
        run: npx quartz build

      # 자동 갱신용 버전 표시: 기록(build)·사이트 코드(code) 버전을 static/bn-version.json과 모든 페이지 <head>에 넣는다
      # (liveUpdate.inline.ts가 이 둘을 비교한다. code는 .quartz·.github 파일 내용의 해시)
      - name: Stamp version
        run: |
          CODE=$(find notes/.quartz notes/.github -type f -print0 | sort -z | xargs -0 sha1sum | sha1sum | cut -c1-12)
          BUILD="$GITHUB_SHA"
          printf '{"build":"%s","code":"%s"}\n' "$BUILD" "$CODE" > quartz/public/static/bn-version.json
          find quartz/public -name '*.html' -exec sed -i "s|</head>|<meta name=\"bn-build\" content=\"$BUILD\"><meta name=\"bn-code\" content=\"$CODE\"></head>|" {} +

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
